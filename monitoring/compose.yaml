name: daryn-lab07-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle          # POST /-/reload перечитывает конфиг
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19097}:9090"
    networks:
      - default
      - scrape
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13007}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-18087}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:v11.0.1
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-18887}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
networks:
  scrape:
    external: true
    name: daryn-lab07-scrape
