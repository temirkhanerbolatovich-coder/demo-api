name: daryn-lab03-compose
services:
  api:
    image: ${API_IMAGE:-daryn-demo-api}:${API_TAG:-local}
    build:
      context: .
      args:
        APP_VERSION: ${API_TAG:-local}
    ports:
      - "127.0.0.1:${API_PORT:-18093}:8080"
    environment:
      Storage: Postgres
      ConnectionStrings__Db: >-
        Host=db;Database=demo;Username=demo;
        Password=${DB_PASSWORD:?Set DB_PASSWORD}
      Chaos__Enabled: "${CHAOS_ENABLED:-false}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-25433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
