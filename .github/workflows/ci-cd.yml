name: ci-cd

on:
  pull_request:
    branches: [main, lab8/incident]
  push:
    branches: [main, lab8/incident]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI: сборка и тесты на каждый PR и push ----------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U demo -d demo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      Storage: Postgres
      ConnectionStrings__Db: Host=localhost;Port=5432;Database=demo;Username=demo;Password=demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  # ---------- Сборка образа и публикация в GHCR (не для PR) ----------
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.ref == 'refs/heads/lab8/incident' || github.ref == 'refs/tags/v1.1.0'
    runs-on: ubuntu-latest
    env:
      API_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated deployment credentials
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "DB_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "API_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Deploy exact image and verify service
        run: |
          docker compose pull api
          docker compose up -d --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18093/health/ready
          expected="${API_TAG#sha-}"
          actual="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18093/ | jq -r .version)"
          [[ "$actual" == "$expected"* ]]
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:18093/api/tasks
      - name: Stop isolated Compose project
        if: always()
        run: docker compose down

